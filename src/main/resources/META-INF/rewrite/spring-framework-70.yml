---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.framework.UpgradeSpringFramework_7_0
displayName: Migrate to Spring Framework 7.0
description: Migrate applications to the latest Spring Framework 7.0 release.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - org.openrewrite.java.spring.framework.UpgradeSpringFramework_6_2
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework
      artifactId: "*"
      newVersion: 7.0.x
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.springframework.http.HttpStatus.UNPROCESSABLE_ENTITY
      fullyQualifiedConstantName: org.springframework.http.HttpStatus.UNPROCESSABLE_CONTENT
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.springframework.http.HttpStatus.PAYLOAD_TOO_LARGE
      fullyQualifiedConstantName: org.springframework.http.HttpStatus.CONTENT_TOO_LARGE
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.springframework.test.web.servlet.result.StatusResultMatchers isPayloadTooLarge()
      newMethodName: isContentTooLarge
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.springframework.test.web.servlet.result.StatusResultMatchers isUnprocessableEntity()
      newMethodName: isUnprocessableContent
  # `syncBody(Object)`, deprecated since 5.2, was removed in favor of `bodyValue(Object)`
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.springframework.web.reactive.function.server.ServerResponse.BodyBuilder syncBody(java.lang.Object)
      newMethodName: bodyValue
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.springframework.web.reactive.function.client.WebClient.RequestBodySpec syncBody(java.lang.Object)
      newMethodName: bodyValue
      matchOverrides: true
  - org.openrewrite.java.testing.junit6.JUnit5to6Migration
  - org.openrewrite.java.spring.framework.UpgradeJacksonUnlessSpringBootJackson2
  - org.openrewrite.java.spring.kafka.UpgradeSpringKafka_4_0
  - org.openrewrite.java.jspecify.MigrateFromSpringFrameworkAnnotations

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.framework.UpgradeJacksonUnlessSpringBootJackson2
displayName: Migrate to Jackson 3 in modules without `spring-boot-jackson2`
description: >-
  Migrate from Jackson 2 to Jackson 3, except in modules that depend on `spring-boot-jackson2`. A Spring Boot 4
  application declares that dependency to keep using Jackson 2, for example for a library that needs a Jackson 2
  `ObjectMapper`.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.springframework.boot
      artifactIdPattern: spring-boot-jackson2
      invertMarking: true
recipeList:
  - org.openrewrite.java.jackson.UpgradeJackson_2_3
