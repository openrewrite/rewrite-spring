---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.security7.UpgradeSpringSecurity_7_0
displayName: Migrate to Spring Security 7.0
description: >-
  Migrate applications to the latest Spring Security 7.0 release. This recipe will modify an
  application's build files, make changes to deprecated/preferred APIs, and migrate configuration settings that have
  changes between versions.
tags:
  - spring
  - security
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.security
      artifactId: "*"
      newVersion: 7.0.x
  - org.openrewrite.java.spring.security7.SecurityConfigurerRemoveThrowsException
  - org.openrewrite.java.spring.security7.WidenAuthorizationManagerSupplierParameter
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: "org.springframework.security.authorization.AuthorizationManager check(..)"
      newMethodName: authorize
      matchOverrides: true
  - org.openrewrite.java.spring.security7.MigrateOpenSaml4ToOpenSaml5

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.security7.SecurityConfigurerRemoveThrowsException
displayName: Remove throws exception in `SecurityConfigurer` methods `init` and `configure`
description: >-
  Remove throws exception in `SecurityConfigurer` methods `init` and `configure`.
tags:
  - spring
  - security
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - org.openrewrite.java.RemoveMethodThrows:
      methodPattern: "org.springframework.security.config.annotation.SecurityConfigurer init(..)"
      matchOverrides: true
      exceptionTypePattern: "java.lang.Exception"
  - org.openrewrite.java.RemoveMethodThrows:
      methodPattern: "org.springframework.security.config.annotation.SecurityConfigurer configure(..)"
      matchOverrides: true
      exceptionTypePattern: "java.lang.Exception"

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.security7.MigrateOpenSaml4ToOpenSaml5
displayName: Migrate the OpenSAML 4 classes of Spring Security to their OpenSAML 5 counterparts
description: >-
  Spring Security 7 removed the `OpenSaml4*` classes of its SAML 2.0 service provider support, which were deprecated
  in 6.5 in favor of the `OpenSaml5*` classes in the same packages.
tags:
  - spring
  - security
  - saml
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.authentication.OpenSaml4AuthenticationProvider
      newFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.authentication.OpenSaml5AuthenticationProvider
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.authentication.logout.OpenSaml4LogoutRequestValidator
      newFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.authentication.logout.OpenSaml5LogoutRequestValidator
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.authentication.logout.OpenSaml4LogoutResponseValidator
      newFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.authentication.logout.OpenSaml5LogoutResponseValidator
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.metadata.OpenSaml4MetadataResolver
      newFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.metadata.OpenSaml5MetadataResolver
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.registration.OpenSaml4AssertingPartyMetadataRepository
      newFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.registration.OpenSaml5AssertingPartyMetadataRepository
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.web.OpenSaml4AuthenticationTokenConverter
      newFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.web.OpenSaml5AuthenticationTokenConverter
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.web.authentication.OpenSaml4AuthenticationRequestResolver
      newFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.web.authentication.OpenSaml5AuthenticationRequestResolver
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.web.authentication.logout.OpenSaml4LogoutRequestResolver
      newFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.web.authentication.logout.OpenSaml5LogoutRequestResolver
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.web.authentication.logout.OpenSaml4LogoutRequestValidatorParametersResolver
      newFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.web.authentication.logout.OpenSaml5LogoutRequestValidatorParametersResolver
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.web.authentication.logout.OpenSaml4LogoutResponseResolver
      newFullyQualifiedTypeName: org.springframework.security.saml2.provider.service.web.authentication.logout.OpenSaml5LogoutResponseResolver
