---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.boot4.PrepareJackson2Compatibility
displayName: Prepare retained Jackson 2 configuration for Spring Boot 4
description: >-
  Preserve Boot 3 Jackson 2 configuration under the Boot 4 Jackson 2 compatibility namespace.
  Run before Boot 4 property and modular API migrations, on modules deliberately retaining Jackson 2.
recipeList:
  - org.openrewrite.java.spring.ChangeSpringPropertyKey:
      oldPropertyKey: spring.jackson
      newPropertyKey: spring.jackson2
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.springframework.boot.autoconfigure.jackson
      newPackageName: org.springframework.boot.jackson2.autoconfigure
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.springframework.boot.jackson
      newPackageName: org.springframework.boot.jackson2
      recursive: true

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.framework.UpgradeSpringFramework_7_0RetainingJackson2
displayName: Migrate to Spring Framework 7.0 retaining Jackson 2
description: Migrate applications to the latest Spring Framework 7.0 release.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - org.openrewrite.java.spring.framework.UpgradeSpringFramework_6_2
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework
      artifactId: "*"
      newVersion: 7.0.x
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.springframework.http.HttpStatus.UNPROCESSABLE_ENTITY
      fullyQualifiedConstantName: org.springframework.http.HttpStatus.UNPROCESSABLE_CONTENT
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.springframework.http.HttpStatus.PAYLOAD_TOO_LARGE
      fullyQualifiedConstantName: org.springframework.http.HttpStatus.CONTENT_TOO_LARGE
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.springframework.test.web.servlet.result.StatusResultMatchers isPayloadTooLarge()
      newMethodName: isContentTooLarge
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.springframework.test.web.servlet.result.StatusResultMatchers isUnprocessableEntity()
      newMethodName: isUnprocessableContent
  - org.openrewrite.java.testing.junit6.JUnit5to6Migration
  - org.openrewrite.java.spring.kafka.UpgradeSpringKafka_4_0
  - org.openrewrite.java.jspecify.MigrateFromSpringFrameworkAnnotations

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_0RetainingJackson2
displayName: Migrate to Spring Boot 4.0 retaining Jackson 2
description: >-
  Migrate applications to the latest Spring Boot 4.0 release. This recipe will modify an application's build files,
  make changes to deprecated/preferred APIs.
tags:
  - spring
  - boot
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.java.spring.boot4.UsesSpringBoot
recipeList:
  - org.openrewrite.java.spring.boot4.PrepareJackson2Compatibility
  # Upgrade transitive Boot management before older migrations add dependencies against the vendor BOM.
  - org.openrewrite.java.spring.boot4.AddSpringBootBomForTransitiveDependencyManagement:
      newVersion: 4.0.x
  - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5
  - org.openrewrite.java.spring.cloud2025.UpgradeSpringCloud_2025_1
  - org.openrewrite.java.spring.framework.UpgradeSpringFramework_7_0RetainingJackson2
  - org.openrewrite.java.spring.security7.UpgradeSpringSecurity_7_0
  - org.openrewrite.java.spring.batch.SpringBatch5To6Migration
  - org.openrewrite.java.spring.boot4.SpringBootProperties_4_0
  - org.openrewrite.java.spring.boot4.ReplaceMockBeanAndSpyBean
  - org.openrewrite.java.spring.boot4.RelocateWebServerClasses
  - org.openrewrite.hibernate.MigrateToHibernate71
  - org.openrewrite.java.testing.testcontainers.Testcontainers2Migration
  - org.openrewrite.java.springdoc.UpgradeSpringDoc_3_0
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: "*"
      newVersion: 4.0.x
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-dependencies
      newVersion: 4.0.x
      overrideManagedVersion: true
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-maven-plugin
      newVersion: 4.0.x
  # Must run while still on Spring Boot 3 so the precondition can distinguish a Boot 3
  # `jackson-bom.version` override (a Jackson 2 version) from a deliberate Boot 4 one.
  - org.openrewrite.java.spring.boot4.MigrateJacksonBomProperty
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 4.0.x
  - org.openrewrite.maven.RemoveRedundantDependencyVersions:
      groupPattern: tools.jackson*
      onlyIfManagedVersionIs: ANY
  # Drop explicit dependency versions that the Spring Boot 4 BOM now manages at the same or a
  # newer version, along with any version property left unused. `GTE` keeps overrides that are
  # newer than the managed version, so intentional forward pins are preserved.
  - org.openrewrite.maven.RemoveRedundantDependencyVersions:
      onlyIfManagedVersionIs: GTE
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: org.springframework.boot
      newVersion: 4.0.x
  - org.openrewrite.gradle.UpdateGradleWrapper:
      version: ^8.14
      addIfMissing: false
  # Spring Boot 4 requires Kotlin 2.2.x (Spring Boot 4.0.5 manages 2.2.21).
  # Bump Kotlin plugin declarations in Gradle and any explicit kotlin-maven-plugin
  # version in Maven. Plugin recipes update version literals AND properties referenced
  # by `<version>${...}</version>`.
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: org.jetbrains.kotlin.*
      newVersion: 2.2.x
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: org.jetbrains.kotlin
      artifactId: kotlin-maven-plugin
      newVersion: 2.2.x
  # Catch explicit kotlin dependency versions (Gradle, or Maven projects without
  # a Spring Boot parent BOM managing them).
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.jetbrains.kotlin
      artifactId: "*"
      newVersion: 2.2.x
      overrideManagedVersion: true

  # Modular starters must run after parent/BOM upgrades so that
  # AddDependency can see the new artifacts are managed and omit explicit versions
  - org.openrewrite.java.spring.boot4.MigrateLiquibasePropertiesApi
  - org.openrewrite.java.spring.boot4.MigrateToModularStarters

  # https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#aop-starter-pom
  # Remove before the renames below, which would otherwise turn it into `spring-boot-starter-aspectj` first
  - org.openrewrite.java.dependencies.RemoveDependency:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-aop
      unlessUsing: org.aspectj.lang.annotation.*

  # Replace deprecated starters with their new names
  # https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#deprecated-starters
  # Rename without pinning version when dependency-management plugin manages versions via BOM
  - org.openrewrite.java.spring.boot4.RenameDeprecatedStartersManagedVersions
  # Fallback: rename with explicit version for modules without the plugin
  # (no-op where the managed-version variant already renamed the artifact)
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-oauth2-authorization-server
      newArtifactId: spring-boot-starter-security-oauth2-authorization-server
      newVersion: 4.0.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-oauth2-client
      newArtifactId: spring-boot-starter-security-oauth2-client
      newVersion: 4.0.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-oauth2-resource-server
      newArtifactId: spring-boot-starter-security-oauth2-resource-server
      newVersion: 4.0.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-web
      newArtifactId: spring-boot-starter-webmvc
      newVersion: 4.0.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-web-services
      newArtifactId: spring-boot-starter-webservices
      newVersion: 4.0.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-aop
      newArtifactId: spring-boot-starter-aspectj
      newVersion: 4.0.x

  # Additional dependencies that need to move in sync
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: eu.michael-simons.neo4j
      artifactId: neo4j-migrations-spring-boot-starter
      newVersion: 3.0.x
      overrideManagedVersion: true
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: io.github.wimdeblauwe
      artifactId: error-handling-spring-boot-starter
      newVersion: 5.0.x
      overrideManagedVersion: true
  # JobRunr 8.x ships a dedicated Spring Boot 4 starter; the Spring Boot 3 starter
  # is not compatible with Spring Boot 4. Rename to the new starter, then bump every
  # JobRunr artifact (core library and starter) to the latest 8.x release.
  # https://www.jobrunr.io/en/documentation/configuration/spring/
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.jobrunr
      oldArtifactId: jobrunr-spring-boot-3-starter
      newArtifactId: jobrunr-spring-boot-4-starter
      newVersion: 8.x
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.jobrunr
      artifactId: "*"
      newVersion: 8.x
      overrideManagedVersion: true

  - org.openrewrite.java.spring.boot4.AddAutoConfigureTestRestTemplate
  - org.openrewrite.java.spring.boot4.AddAutoConfigureWebTestClient
  - org.openrewrite.java.spring.boot4.AddAutoConfigureMockMvc

  - org.openrewrite.java.spring.boot4.MigrateOpenApiGeneratorToSpringBoot4
  - org.openrewrite.java.spring.boot4.MigrateJsonschema2PojoToSpringBoot4
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.springframework.boot
      artifactId: spring-boot-jackson2
      version: 4.0.x
      onlyIfUsing: org.springframework.boot.SpringApplication
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.springframework.boot
      artifactId: spring-boot-jackson2
      version: 4.0.x
      onlyIfUsing: org.springframework.boot.jackson2..*
  - org.openrewrite.java.spring.AddSpringProperty:
      property: spring.http.converters.preferred-json-mapper
      value: jackson2
  - org.openrewrite.java.spring.AddSpringProperty:
      property: spring.http.codecs.preferred-json-mapper
      value: jackson2
