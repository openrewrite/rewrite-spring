---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.cloud.MigrateToStubbornContract
displayName: Migrate from Spring Cloud Contract to Stubborn Contract
description: >-
  Migrates Spring Cloud Contract dependencies, plugins, Java packages, and Stub Runner
  properties to Stubborn Contract. Select a compatible Stubborn Contract version separately.
tags:
  - spring
  - spring-cloud
  - spring-cloud-contract
  - stubborn-contract
recipeList:
  - org.openrewrite.java.spring.cloud.UpdateMavenDependenciesToStubbornContract
  - org.openrewrite.java.spring.cloud.UpdateGradleDependenciesToStubbornContract
  - org.openrewrite.java.spring.cloud.RenameSpringCloudContractPackages
  - org.openrewrite.java.spring.cloud.RenameStubRunnerProperties

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.cloud.UpdateMavenDependenciesToStubbornContract
displayName: Update Spring Cloud Contract Maven coordinates to Stubborn Contract
description: Replace Spring Cloud Contract dependencies, BOM, and Maven plugin coordinates with Stubborn Contract equivalents.
tags:
  - spring-cloud-contract
  - stubborn-contract
recipeList:
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-verifier
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-verifier
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-stub-runner
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-stub-runner
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-starter-contract-verifier
      newGroupId: sh.stubborn
      newArtifactId: stubborn-starter-contract-verifier
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-starter-contract-stub-runner
      newGroupId: sh.stubborn
      newArtifactId: stubborn-starter-contract-stub-runner
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-wiremock
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-wiremock
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-spec-java
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-spec-java
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-spec-groovy
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-spec-groovy
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-spec-kotlin
      newGroupId: sh.stubborn
      newArtifactId: stubborn-spec-kotlin
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-converters
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-converters
  - org.openrewrite.maven.ChangeManagedDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-dependencies
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-dependencies
  - org.openrewrite.maven.ChangePluginGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-contract-maven-plugin
      newGroupId: sh.stubborn
      newArtifactId: stubborn-contract-maven-plugin

