---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.cloud.RenameSpringCloudContractPackages
displayName: Rename Spring Cloud Contract packages to Stubborn Contract
description: Rename Spring Cloud Contract and its JSON/XML assertion packages to their Stubborn Contract equivalents.
tags:
  - spring-cloud-contract
  - stubborn-contract
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.springframework.cloud.contract
      newPackageName: sh.stubborn.contract
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: com.toomuchcoding.jsonassert
      newPackageName: sh.stubborn.jsonassert
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: com.toomuchcoding.xmlassert
      newPackageName: sh.stubborn.xmlassert
      recursive: true

